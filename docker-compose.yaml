# Use root/example as user/password credentials

services:

  db:
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
    ports:
    - "3306":"3306"
   	volumes:
  	- db_data: /var/lib/mysql
  	
  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PMA_ARBITRARY=1
  	
  	

